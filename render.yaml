# Render Blueprint — deploys backend + frontend + Postgres in one shot.
# In the Render dashboard: New -> Blueprint -> pick this repo. Render reads
# this file and provisions all three services below.
#
# BDC_API_USERNAME / BDC_API_TOKEN are marked `sync: false` on purpose —
# blueprints don't store secret values in git; set them once in the Render
# dashboard after the first deploy (Environment tab on moving-day-api).
# Until then the backend automatically serves labeled sample data instead of
# live FCC results — see README.

services:
  - type: web
    name: moving-day-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Must be the exact deployed frontend origin — no wildcard (security req #6).
      - key: CORS_ORIGIN
        value: https://moving-day-app.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: moving-day-db
          property: connectionString
      - key: BDC_API_USERNAME
        sync: false
      - key: BDC_API_TOKEN
        sync: false

  - type: web
    name: moving-day-app
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked in at build time; must match moving-day-api's URL above.
      - key: VITE_API_BASE_URL
        value: https://moving-day-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: moving-day-db
    plan: free
    databaseName: moving_day
    user: moving_day
